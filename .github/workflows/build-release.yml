name: Build Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Diba APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Run Rust Core Unit Tests
        run: |
          cd diba-core
          cargo test --verbose

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core Libraries for Android
        run: |
          cd diba-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK (Debug Keystore for CI)
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk diba-porn-blocker-v1.0.0-release.apk || cp app/build/outputs/apk/release/app-release.apk diba-porn-blocker-v1.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diba-porn-blocker-v1.0.0-release.apk
          path: diba-porn-blocker-v1.0.0-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: diba-porn-blocker-v1.0.0-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
